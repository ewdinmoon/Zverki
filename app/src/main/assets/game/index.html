   var img=this.addS(this.add.image(cx+cw/2,cy+chh/2-14,mkey).setDisplaySize(140,140).setDepth(7));

  }

   var nh=this.addS(this.add.rectangle(W/2,ny+18,220,36).setInteractive({useHandCursor:true}).setDepth(60));
   nh.on('pointerup',function(){if(self.overlayActive||self.miniActive){return;}sfx('ui');self.museumPage=(self.museumPage+1)%pages;self.clearScreen();self.showMuseum();});
  }
  if(!hallCollected(h)){this.addS(this.add.text(W/2,H-140,tf('mus_bottom',{a:Math.round(h.bonus*100*rankOf(h))}),{fontSize:FS.xs,fontFamily:FF,color:'#9fe0ff',stroke:STK.brown,strokeThickness:3,align:'center'}).setOrigin(0.5).setDepth(6));}
 }
 showExpedition(){

  var panel=this.addS(this.add.graphics().setDepth(6));
  this.sticker(panel,W/2-170,125,340,170,16,0x3f8fd0,0x1b4f8a);
  this.addS(this.add.text(W/2,160,t('exp_name'),{fontSize:FS.med,fontStyle:'bold',fontFamily:FF,color:'#ffe08a',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(7));
  this.addS(this.add.text(W/2,195,t('exp_desc'),{fontSize:FS.sm,fontFamily:FF,color:'#cfe6ff',stroke:STK.brown,strokeThickness:2}).setOrigin(0.5).setDepth(7));
  var pL=this.iconObj('leaf',W/2-75,230,40); pL.setDepth(7); this.addS(pL);

  this.addS(this.add.text(W/2,330,ready?t('exp_start'):'⏳ '+Math.ceil((state.expReadyAt-Date.now())/1000)+(state.lang==='en'?'s':'с'),{fontSize:FS.base,fontStyle:'bold',fontFamily:FF,color:'#fff',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(8));
  var hit=this.addS(this.add.rectangle(W/2,330,230,50).setInteractive({useHandCursor:true}).setDepth(60));
  hit.on('pointerup',function(){
   if(self.overlayActive||self.miniActive){return;}
   if(Date.now()<state.expReadyAt){sfx('err');self.toast(t('exp_notready'));return;}
   sfx('ui');self.startExpedition();
  });
  if(!ready){

   this.sticker(adbg,W/2-115,370,230,44,14,0x4aa8e8,0x1a60b0);
   this.addS(this.add.text(W/2,392,t('exp_ad'),{fontSize:FS.sm,fontStyle:'bold',fontFamily:FF,color:'#fff',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(8));
   var adhit=this.addS(this.add.rectangle(W/2,392,230,44).setInteractive({useHandCursor:true}).setDepth(60));
   adhit.on('pointerup',function(){

   });

  this.updateBackground(this.currentWorldHall().id);
 }
 startExpedition(){
  var self=this;this.miniActive=true;this.clearScreen();
  var timeLeft=30;var score={coins:0,gems:0,finds:0};
  this.addO(this.add.rectangle(W/2,H/2,W,H,0x0a2010).setAlpha(0.92).setDepth(70));
  for(var r=0;r<3;r++){
   var ray=this.addO(this.add.image(80+r*160,-40,'radialDot').setScale(1.2,9).setAngle(0.5).setTint(0xfff6c0).setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.10).setDepth(70));
   self.tweens.add({targets:ray,alpha:0.22,duration:1600+r*300,yoyo:true,repeat:-1,ease:'Sine.inOut'});
  }
  var timer=this.addO(this.add.text(W/2,40,'',{fontSize:FS.lg,fontStyle:'bold',fontFamily:FF,color:'#ffe08a',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(73));
  this.addO(this.add.image(W/2-132,74,this.coinKey()).setDisplaySize(26,26).setOrigin(0.5,0.5).setDepth(73));
  var cT=this.addO(this.add.text(W/2-114,74,'0',{fontSize:FS.sm,fontStyle:'bold',fontFamily:FF,color:'#ffe08a',stroke:STK.brown,strokeThickness:2}).setOrigin(0,0.5).setDepth(73));
  this.addO(this.add.image(W/2-42,74,this.iconKey('art_gem','gem',64)).setDisplaySize(26,26).setOrigin(0.5,0.5).setDepth(73));
  var gT=this.addO(this.add.text(W/2-24,74,'0',{fontSize:FS.sm,fontStyle:'bold',fontFamily:FF,color:'#9fe0ff',stroke:STK.brown,strokeThickness:2}).setOrigin(0,0.5).setDepth(73));
  var pI=this.iconObj('paw',W/2+40,74,26); pI.setDepth(73); this.addO(pI);
  var pT=this.addO(this.add.text(W/2+58,74,'0',{fontSize:FS.sm,fontStyle:'bold',fontFamily:FF,color:'#cfe6ff',stroke:STK.brown,strokeThickness:2}).setOrigin(0,0.5).setDepth(73));
  var objs=[{kind:'leaf'},{kind:'bone'},{kind:'paw'},{kind:'gem'}];
  var fallings=[];
  function spawn(){
   if(timeLeft<=0||self._paused){return;}
   var o=objs[Math.floor(Math.random()*objs.length)];
   var ox=40+Math.random()*(W-80),oy=-30;
   var sz=(o.kind==='gem')?34:40;
   var t=self.iconObj(o.kind,ox,oy,sz);
   t.setDepth(72); self.addO(t);
   t._kind=o.kind; t._caught=false;
   fallings.push(t);
   self.tweens.add({targets:t,y:H+40,duration:2600+Math.random()*900,ease:'Linear',onComplete:function(){ var ii=fallings.indexOf(t); if(ii>=0)fallings.splice(ii,1); if(!t._caught)t.destroy(); }});
  }
  function catchAt(px,py){
   var best=null,bestScore=-1;
   for(var i=0;i<fallings.length;i++){
    var t=fallings[i]; if(t._caught||!t.active)continue;
    var dx=px-t.x, dy=py-t.y; var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=70){ var sc=t.y - dist*0.3; if(sc>bestScore){bestScore=sc;best=t;} }
   }
   if(best){
    best._caught=true;
    var k=best._kind;
    if(k==='gem'){score.gems=(score.gems||0)+1; gT.setText(score.gems);}
    else if(k==='paw'){score.finds=(score.finds||0)+1; pT.setText(score.finds);}
    else {score.coins=(score.coins||0)+(k==='bone'?250:100); cT.setText(score.coins);}
    sfx('coin');
    if(self.catchBurst){ self.catchBurst.emitParticleAt(px,py,10); }
    var ii=fallings.indexOf(best); if(ii>=0)fallings.splice(ii,1);
    self.tweens.killTweensOf(best);
    self.tweens.add({targets:best,scaleX:1.12,scaleY:1.12,alpha:0,duration:110,onComplete:function(){best.destroy();}});
   }
  }
  var tapZone=this.addO(this.add.zone(W/2,H/2,W,H).setOrigin(0.5,0.5).setInteractive({useHandCursor:true}).setDepth(71));
  tapZone.on('pointerdown',function(p){ if(self._paused)return; catchAt(p.x,p.y); });
  var spawnEv=this.time.addEvent({delay:340,loop:true,callback:spawn});
  var tickEv=this.time.addEvent({delay:1000,loop:true,callback:function(){
   timeLeft--;timer.setText('⏱ '+timeLeft+(state.lang==='en'?'s':'с'));
   if(timeLeft<=0){spawnEv.remove();tickEv.remove();tapZone.destroy();fallings=[];self.finishExpedition(score);}
  }});
  timer.setText('⏱ 30'+(state.lang==='en'?'s':'с'));
 }
 finishExpedition(score){
  var expMult=perkMult('exp');
  var gainedCoins=Math.floor((score.coins||0)*expMult*prestigeMult()),gainedGems=Math.floor((score.gems||0)*expMult);
  state.coins+=gainedCoins;state.gems+=gainedGems;var foundPet=null;bumpQuest('exp',1);
  if((score.finds||0)>0&&Math.random()<0.6){var rar=Math.random()<0.3?'rare':'uncommon';var sp=rollSpecies(rar);addPet(sp.id,1);foundPet=sp;}
  state.expReadyAt=Date.now()+5*60*1000;save();saveCloud(true);this.refreshTop();
  var body='+'+fmt(gainedCoins)+t('exp_coins')+gainedGems+t('exp_gems');
  if(foundPet){body+=t('exp_found')+spName(foundPet);}
  this.miniActive=false;
  this.clearOverlay();
  this.showReward(t('exp_done'),body,'#5fc04a');
 }
 startMeteor(){
  if(this.miniActive||this.overlayActive||this.meteorStarted){return;}
  this.meteorStarted=true;state.meteorDay=dayKey();save();this.miniActive=true;
  var self=this;var timeLeft=45;var score=0;
  this.addO(this.add.rectangle(W/2,H/2,W,H,0x100820).setAlpha(0.85).setDepth(70));
  this.addO(this.add.text(W/2,40,t('meteor_title'),{fontSize:FS.lg,fontStyle:'bold',fontFamily:FF,color:'#ff8a20',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(73));
  var timer=this.addO(this.add.text(W/2,72,'',{fontSize:FS.med,fontStyle:'bold',fontFamily:FF,color:'#ffe08a',stroke:STK.brown,strokeThickness:3}).setOrigin(0.5).setDepth(73));
  var scoreT=this.addO(this.add.text(W/2,98,t('caught')+'0',{fontSize:FS.sm,fontFamily:FF,color:'#cfe6ff',stroke:STK.brown,strokeThickness:2}).setOrigin(0.5).setDepth(73));
  var fallings=[];
  function spawn(){
   if(timeLeft<=0||self._paused){return;}
   var golden=Math.random()<0.12;
   var ox=40+Math.random()*(W-80),oy=-30;
   var t;
   if(golden){ t=self.addO(self.add.image(ox,oy,self.iconKey('art_dust','dust',96)).setDisplaySize(56,56).setOrigin(0.5,0.5).setDepth(72)); }
   else { t=self.addO(self.add.text(ox,oy,'☄️',{fontSize:56}).setOrigin(0.5).setDepth(72)); }
   t._golden=golden; t._caught=false;
   fallings.push(t);
   self.tweens.add({targets:t,y:H+40,duration:2200+Math.random()*1000,ease:'Linear',onComplete:function(){ var ii=fallings.indexOf(t); if(ii>=0)fallings.splice(ii,1); if(!t._caught)t.destroy(); }});
  }
  function catchAt(px,py){
   var best=null,bestScore=-1;
   for(var i=0;i<fallings.length;i++){
    var t=fallings[i]; if(t._caught||!t.active)continue;
    var dx=px-t.x, dy=py-t.y; var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<=70){ var sc=t.y - dist*0.3; if(sc>bestScore){bestScore=sc;best=t;} }
   }
   if(best){
    best._caught=true; score+=best._golden?5000:500; sfx('coin'); scoreT.setText(t('caught')+fmt(score));
    var ii=fallings.indexOf(best); if(ii>=0)fallings.splice(ii,1);
    self.tweens.killTweensOf(best);
    self.tweens.add({targets:best,scaleX:1.12,scaleY:1.12,alpha:0,duration:110,onComplete:function(){best.destroy();}});
   }
  }
  var tapZone=this.addO(this.add.zone(W/2,H/2,W,H).setOrigin(0.5,0.5).setInteractive({useHandCursor:true}).setDepth(71));
  tapZone.on('pointerdown',function(p){ if(self._paused)return; catchAt(p.x,p.y); });
  var spawnEv=this.time.addEvent({delay:300,loop:true,callback:spawn});
  var tickEv=this.time.addEvent({delay:1000,loop:true,callback:function(){
   timeLeft--;timer.setText('⏱ '+timeLeft+(state.lang==='en'?'s':'с'));
   if(timeLeft<=0){spawnEv.remove();tickEv.remove();tapZone.destroy();fallings=[];self.finishMeteor(score);}
  }});
  timer.setText('⏱ 45'+(state.lang==='en'?'s':'с'));
 }
 finishMeteor(score){
  try{
   var gained=Math.floor(score*prestigeMult());
   state.coins+=gained;state.totalEarned+=gained;var bonusGem=Math.floor(score/5000);state.gems+=bonusGem;
   save();saveCloud(true);this.refreshTop();
   this.miniActive=false;this.meteorStarted=false;
   this.clearOverlay();
   this.showReward(t('meteor_done'),'+'+fmt(gained)+t('meteor_coins')+(bonusGem>0?t('meteor_gems')+bonusGem+t('meteor_gems2'):'')+t('meteor_next'),'#ff8a20');
  }catch(e){
   this.miniActive=false;this.meteorStarted=false;
   try{this.clearOverlay();}catch(e2){}
   try{this.clearScreen();this.showTap();}catch(e3){}
  }
 }

  var okh=this.addO(this.add.rectangle(W/2,H/2+62,170,44).setInteractive({useHandCursor:true}).setDepth(74));

   state.coins+=gained;state.totalEarned+=gained;self.refreshTop();sfx('reward');self.clearOverlay();save();saveCloud(true);self.checkLoginReward();self.checkHalls();

 fakeAd(cb){ yaRewarded(cb); }
 toast(t2){
  if(this._tt){this._tt.destroy();}
  this._tt=this.add.text(W/2,200,t2,{fontSize:FS.base,fontStyle:'bold',fontFamily:FF,color:'#ffe08a',backgroundColor:'rgba(16,38,74,0.95)',padding:{x:16,y:10},stroke:STK.brown,strokeThickness:2}).setOrigin(0.5).setDepth(80);
  var self=this;
  this.time.delayedCall(2200,function(){if(self._tt){self._tt.destroy();self._tt=null;}});
 }
}

 new Phaser.Game({type:Phaser.AUTO,parent:'app',width:W,height:H,backgroundColor:'#0a1830',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Game]});
